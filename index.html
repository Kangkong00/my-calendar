<style>
:root{
  --bg:#070504; --ink:#EFE3CF; --mut:#A89275; --dim:#7F6B55; --line:#3A2A1E; --line2:#241911; --line3:#1E150F;
  --gold:linear-gradient(135deg,#F3DCA6 0%,#C9A46A 50%,#8E6B3A 100%); --goldL:#E3C48E; --goldM:#C9A46A; --dark:#140D09;
  --sun:#E8957A; --sat:#93B8DA;
  --card:linear-gradient(180deg,#1C130E,#110B08);
  --sat-top:env(safe-area-inset-top,0px); --sat-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,label,a,.pillb,.mday,.blk,.tb{touch-action:manipulation;-webkit-user-select:none;user-select:none}
select{font-size:16px!important}
.scrollx{overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.sbody{overscroll-behavior:contain}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
input::placeholder,textarea::placeholder{color:#8F7A62}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;perspective:1800px;
  background:radial-gradient(120% 45% at 50% 0%,#2A1C13 0%,#0E0907 55%,#070504 100%)}
.serif{font-family:'Nanum Myeongjo',serif;font-weight:800}
.goldtext{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}

/* header */
header{padding:calc(var(--sat-top) + 14px) 14px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.titlebox{display:flex;flex-direction:column;gap:1px;border:none;background:none;padding:0;text-align:left}
.titlebox small{font-size:11px;color:var(--mut);letter-spacing:4px}
.titlebox h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:2px}
.hright{display:flex;align-items:center;gap:6px}
.navarrow{width:36px;height:40px;border:none;background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:12px;background:#0A0705;border:1px solid var(--line)}
.seg button{height:34px;min-width:44px;border:none;border-radius:9px;background:transparent;color:var(--mut);font-size:14px}
.seg button.on{background:linear-gradient(180deg,#2E2016,#1E150F);box-shadow:inset 0 0 0 1px #6E5236;color:var(--goldL);font-weight:700}

main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

/* month */
.wdrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:11px;color:var(--mut);padding:4px 4px 4px;border-bottom:1px solid var(--line2)}
.wdrow span:first-child{color:var(--sun)} .wdrow span:last-child{color:var(--sat)}
.month{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 4px}
.mweek{position:relative;flex:1;min-height:0;border-bottom:1px solid var(--line3)}
.mdays{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mday{position:relative;border:none;border-right:1px solid var(--line3);background:transparent;padding:4px 0 0;display:flex;justify-content:center;align-items:flex-start}
.mday:last-child{border-right:none}
.mday.today{background:linear-gradient(180deg,rgba(201,164,106,.10),rgba(201,164,106,.02))}
.mnum{width:22px;height:22px;line-height:22px;border-radius:11px;font-size:13px;text-align:center}
.mday.today .mnum{background:var(--gold);color:var(--dark);font-weight:700}
.mday.out .mnum{color:#4A3B30}
.mday.sun .mnum{color:var(--sun)} .mday.sat .mnum{color:var(--sat)} .mday.hol .mnum{color:var(--sun)}
.mday.today.sun .mnum,.mday.today.sat .mnum,.mday.today.hol .mnum{color:var(--dark)}
.bar{position:absolute;pointer-events:none;height:17px;line-height:17px;padding:0 4px;border-radius:4px;font-size:10.5px;font-weight:500;white-space:nowrap;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.bar.hol{background:transparent!important;box-shadow:none;color:var(--sun)!important;font-weight:400;padding:0 2px}
.pills{position:absolute;left:3px;right:3px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;pointer-events:none}
.pill{width:13px;height:6px;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.more{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:10px;color:var(--mut);pointer-events:none}

/* week */
.wkhead{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));padding:2px 6px 4px 0}
.wkh{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 0;color:var(--mut);font-size:11px}
.wkh b{width:26px;height:26px;line-height:26px;border-radius:13px;font-size:14px;color:var(--ink)}
.wkh.today b{background:var(--gold);color:var(--dark)}
.wkh.sun{color:var(--sun)} .wkh.sat{color:var(--sat)}
.wkallday{position:relative;margin:0 6px 4px 34px}
.wkgrid{flex:1;min-height:0;margin:0 6px calc(76px + var(--sat-bot)) 0;position:relative;border-radius:14px;background:linear-gradient(180deg,#1A120D,#0F0A07);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(227,196,142,.12);overflow:hidden}
.wkcols{position:absolute;left:34px;right:0;top:0;bottom:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wkcol{position:relative;border-left:1px solid var(--line3)}
.wkcol.today{background:linear-gradient(180deg,rgba(201,164,106,.10),rgba(201,164,106,.02))}
.hl{position:absolute;left:34px;right:0;border-top:1px solid var(--line3);pointer-events:none}
.hl.six{border-top-color:var(--line)}
.hlab{position:absolute;left:0;width:30px;text-align:right;font-size:9.5px;color:#6E5A47;transform:translateY(-6px);pointer-events:none}
.hlab.six{font-size:11px;font-weight:700;color:var(--goldM)}
.blk{position:absolute;border:none;text-align:center;overflow:hidden;border-radius:5px;padding:3px 2px 2px;font-size:8.5px;font-weight:500;line-height:1.2;word-break:keep-all;overflow-wrap:anywhere;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;letter-spacing:-.2px;box-shadow:0 2px 6px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22)}
.nowline{position:absolute;height:1.5px;background:linear-gradient(90deg,#E3C48E,rgba(227,196,142,.15));pointer-events:none;box-shadow:0 0 6px rgba(227,196,142,.6)}

/* nav */
nav{position:absolute;left:0;right:0;bottom:0;height:calc(70px + var(--sat-bot));padding:0 12px var(--sat-bot);display:flex;align-items:center;justify-content:space-around;background:linear-gradient(180deg,rgba(10,7,5,.75),#070504);border-top:1px solid var(--line2);z-index:5}
nav button{min-width:58px;height:48px;border:none;background:transparent;color:var(--mut);font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button.on{color:var(--goldL);font-weight:700}
nav .fab{width:54px;height:54px;min-width:54px;border-radius:27px;border:1px solid #F3DCA6;background:var(--gold);color:var(--dark);box-shadow:0 8px 20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.5)}
nav .fab:active{transform:scale(.94)}
.month{padding-bottom:calc(72px + var(--sat-bot))}

/* sheets */
.dim{position:fixed;inset:0;background:rgba(3,2,1,.55);z-index:20;animation:fade .25s ease both}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;z-index:21;display:flex;flex-direction:column;border-radius:22px 22px 0 0;
  background:radial-gradient(120% 40% at 50% 0%,#2A1C13 0%,#120C09 45%,#0A0705 100%);border-top:1px solid #4A3626;box-shadow:0 -12px 30px rgba(0,0,0,.6),inset 0 1px 0 rgba(201,164,106,.25);animation:up .36s cubic-bezier(.2,.9,.2,1) both}
.sheet.closing{animation:down .25s ease-in both} .dim.closing{animation:fadeout .25s ease both}
.sheet .grab{align-self:center;width:40px;height:4px;border-radius:2px;background:#4A3626;margin-top:8px;flex-shrink:0}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px 10px;border-bottom:1px solid #2A1D15;flex-shrink:0}
.shead h2{margin:0;font-size:18px;color:var(--goldL)}
.sbody{flex:1;min-height:0;overflow-y:auto;padding:14px 16px calc(24px + var(--sat-bot));display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.tbtn{min-width:52px;height:40px;border:none;background:transparent;color:var(--mut);font-size:15px}
.gbtn{min-width:64px;height:40px;padding:0 16px;border-radius:20px;border:1px solid #F3DCA6;background:var(--gold);color:var(--dark);font-size:15px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.gbtn[disabled]{opacity:.5}
.obtn{height:40px;padding:0 14px;border-radius:20px;border:1px solid #4A3626;background:transparent;color:var(--ink);font-size:14px}
.ibtn{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center}
.lab{font-size:12px;color:var(--mut)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.scrollx{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scrollx::-webkit-scrollbar{display:none}
.pillb{min-height:36px;padding:0 12px;border-radius:18px;font-size:13px;white-space:nowrap;flex-shrink:0;background:transparent;color:var(--ink);border:1px solid #4A3626}
.pillb.on{background:var(--gold);color:var(--dark);border-color:#F3DCA6;font-weight:700}
.pillb.dash{border-style:dashed;border-color:#8C6A47;color:var(--goldL)}
.box{display:flex;flex-direction:column;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(227,196,142,.06)}
.boxrow{display:flex;align-items:center;gap:8px;min-height:50px;padding:0 14px;border-bottom:1px solid var(--line)}
.boxrow:last-child{border-bottom:none}
.inp{height:46px;border-radius:12px;border:1px solid var(--line);background:#120C09;padding:0 12px;font-size:16px;width:100%}
textarea.inp{height:80px;padding:10px 12px;resize:none}
.title-inp{height:50px;border:none;border-bottom:1px solid #6E5236;background:transparent;font-size:21px;padding:0 2px;outline:none;width:100%}
input[type=date].inp{color-scheme:dark;min-width:0}
.switch{position:relative;width:50px;height:30px;border-radius:15px;border:1px solid #4A3626;background:#0F0A07;flex-shrink:0}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#6E5236;transition:left .2s,background .2s}
.switch.on{background:var(--gold);border-color:#F3DCA6}.switch.on i{left:23px;background:var(--dark)}
.timebtn{height:36px;padding:0 12px;border-radius:10px;font-size:15px;border:1px solid #4A3626;background:#2A1D15}
.timebtn.on{background:var(--gold);color:var(--dark);border-color:#F3DCA6;font-weight:700}
.picker{display:flex;flex-direction:column;gap:8px;padding:10px 0 12px;background:#1B130E;border-bottom:1px solid var(--line)}
.fine{display:flex;gap:6px;padding:0 14px;align-items:center}
.fine button{flex:1;height:40px;border-radius:20px;border:1px solid #4A3626;background:transparent;font-size:13px}
.wdays{display:flex;justify-content:space-between;gap:4px}
.wdays button{width:42px;height:42px;border-radius:21px;border:1px solid #4A3626;background:transparent;font-size:14px}
.wdays button.on{background:var(--gold);color:var(--dark);border-color:#F3DCA6;font-weight:700}
.alarmchip{display:inline-flex;align-items:center;height:40px;padding:0 2px 0 14px;border-radius:20px;background:var(--gold);color:var(--dark);font-size:14px;font-weight:500}
.alarmchip button{width:36px;height:36px;border:none;background:transparent;color:var(--dark);display:flex;align-items:center;justify-content:center}
.note{margin:0;font-size:13px;color:var(--mut);line-height:1.55}
.note b{color:var(--goldL)}
.swatches{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;justify-items:center}
.swatches button{width:34px;height:34px;border-radius:17px;border:1px solid rgba(255,255,255,.12)}
.swatches button.on{border:2px solid #F3DCA6;box-shadow:0 0 0 2px #0F0A07 inset,0 0 10px rgba(243,220,166,.5)}

/* day timeline */
.tl{position:relative}
.tl .h{position:absolute;left:0;right:0;display:flex;align-items:flex-start;pointer-events:none}
.tl .h span{width:46px;text-align:right;padding-right:8px;font-size:11px;color:var(--dim);transform:translateY(-7px)}
.tl .h i{flex:1;border-top:1px solid var(--line2)}
.tb{position:absolute;border:none;text-align:left;border-radius:9px;padding:4px 9px;overflow:hidden;display:flex;flex-direction:column;gap:1px;box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22)}
.tb b{font-size:13px;line-height:1.2} .tb small{font-size:11px;opacity:.85;white-space:nowrap}
.adlist{display:flex;gap:6px;flex-wrap:wrap}
.adchip{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;border:none}

.evlist{display:flex;flex-direction:column}
.evrow{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-bottom:1px solid var(--line)}
.evrow:last-child{border-bottom:none}
.evrow input{width:20px;height:20px;accent-color:#C9A46A}
.evrow .t{width:78px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.evrow .n{flex:1;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mini button{height:38px;border-radius:10px;border:1px solid transparent;background:transparent;font-size:14px}
.mini button.on{background:var(--gold);color:var(--dark);border-color:#F3DCA6;font-weight:700}
.mini button[disabled]{color:#4A3B30}
.mini span{text-align:center;font-size:11px;color:var(--mut)}
.summary{margin:0;padding:12px 14px;border-radius:12px;background:#0F0A07;border:1px solid var(--line);font-size:14px;line-height:1.6}

.toast{position:fixed;left:50%;bottom:calc(92px + var(--sat-bot));transform:translateX(-50%);z-index:40;padding:10px 16px;border-radius:20px;background:#1E150F;border:1px solid #6E5236;color:var(--goldL);font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.6);animation:toast 2.4s ease both;white-space:nowrap}
.loading{position:absolute;top:4px;right:14px;font-size:11px;color:var(--mut);z-index:3}
.banner{margin:0 12px 6px;padding:8px 12px;border-radius:10px;border:1px solid #6E5236;background:rgba(201,164,106,.08);font-size:12.5px;color:var(--goldL);display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner button{border:none;background:none;color:var(--goldL);text-decoration:underline;font-size:12.5px;padding:4px}

@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes down{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}to{opacity:1}} @keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes slideL{from{transform:translateX(24px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-24px);opacity:.3}to{transform:none;opacity:1}}
.anim-l{animation:slideL .28s ease both}.anim-r{animation:slideR .28s ease both}

.scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px calc(96px + var(--sat-bot))}
.sync{position:absolute;top:2px;right:16px;width:6px;height:6px;border-radius:3px;background:var(--goldL);box-shadow:0 0 8px var(--goldL);animation:pulse 1s ease-in-out infinite;z-index:4}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
/* tasks */
.prog{display:flex;flex-direction:column;gap:6px;margin:4px 4px 0}
.prog .t{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.prog .b{height:4px;border-radius:2px;background:#241911;overflow:hidden}
.prog .b i{display:block;height:100%;background:var(--gold);box-shadow:0 0 8px rgba(227,196,142,.6);transition:width .4s}
.qadd{margin:14px 0 0;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(227,196,142,.12),0 10px 24px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px}
.qadd .r{display:flex;gap:8px;align-items:center}
.qadd input{flex:1;height:44px;border:none;border-bottom:1px solid #4A3626;background:transparent;font-size:16px;padding:0 4px;outline:none}
.qadd .go{width:44px;height:44px;border-radius:22px;border:1px solid #F3DCA6;background:var(--gold);color:var(--dark);display:flex;align-items:center;justify-content:center}
.tgroup{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.tgh{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 0}
.tgh h3{margin:0;font-size:16px;color:var(--goldL)} .tgh h3.late{color:var(--sun)} .tgh h3.mute{color:var(--mut)}
.tgh h3 small{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:400;color:var(--mut);margin-left:4px}
.tlist{display:flex;flex-direction:column;border-radius:14px;background:linear-gradient(180deg,#1A120D,#0F0A07);border:1px solid var(--line)}
.trow{position:relative;overflow:hidden;display:flex;align-items:center;gap:4px;padding-left:4px;min-height:52px;border-bottom:1px solid var(--line2);transition:opacity .6s ease .7s}
.trow:last-child{border-bottom:none}
.trow.done{opacity:.6}
.ck{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}

<script>
'use strict';
const APP_V = '3.10';
/* ========== 기본 도구 ========== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pymd = s => { const [a, b, c] = s.slice(0, 10).split('-').map(Number); return new Date(a, b - 1, c); };
const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const same = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const mins = d => d.getHours() * 60 + d.getMinutes();
const ko = m => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mi = m % 60; return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + pad(mi); };
const koD = d => (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WD[d.getDay()] + ')';
const md = d => (d.getMonth() + 1) + '/' + d.getDate();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isoLocal = d => { const o = -d.getTimezoneOffset(), sg = o >= 0 ? '+' : '-', a = Math.abs(o); return ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':00' + sg + pad(Math.floor(a / 60)) + ':' + pad(a % 60); };
const mkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const lum = hex => { const h = (hex || '#888888').replace('#', ''); const v = [0, 2, 4].map(i => { const c = parseInt(h.substr(i, 2), 16) / 255; return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); }); return .2126 * v[0] + .7152 * v[1] + .0722 * v[2]; };
const fg = hex => { try { const L = lum(hex); return (L + .05) / .055 >= 1.05 / (L + .05) ? '#1A120D' : '#FFFFFF'; } catch (e) { return '#FFFFFF'; } };
const ICON = {
  x: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',

/* ========== 설정 & 저장소 ========== */
const DEF = { url: '', key: '', hiddenMonth: [], hideTags: true, view: 'month', tab: 'cal', listId: '', showPlans: false };

  get(k) { try { return JSON.parse(localStorage.getItem('cal.c.' + (demo() ? 'demo.' : '') + k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('cal.c.' + (demo() ? 'demo.' : '') + k, JSON.stringify(v)); } catch (e) {} }

/* ========== 예시 데이터 ========== */
const Demo = (() => {
  const cals = [
    ['ko.south_korea#holiday@group.v.calendar.google.com', '대한민국의 휴일', '#9E5B4A', false],
    ['me', '[[강프로]]', '#8E6B3A', true], ['edu', '<교육>', '#5DB07A', true], ['att', '<근태>', '#8D8D8D', true],

    ['conf', '<회의>', '#3F51B5', true], ['fam', '[Family]행복하자', '#7B7397', true], ['sleep', '[Sleep]수면하자', '#D9BFC0', true],
    ['work', '[Work]업무하자', '#E3A35E', true], ['study', '[Study]공부하자', '#9A5BB5', true], ['golf', '[Golf]골프하자', '#A3908B', true],
    ['sport', '[Sports]운동하자', '#33B679', true], ['ai', '[AI]자동하자', '#616161', true], ['read', '[Reading]독서하자', '#E67C73', true]
  ].map(c => ({ id: c[0], name: c[1], color: c[2], owned: c[3], primary: c[0] === 'me' }));
  let evs = [], seq = 1, tasks = [], phases = [];
  const col = id => (cals.find(x => x.id === id) || {}).color;
  const t = new Date(), today = sod(t), base = new Date(t.getFullYear(), t.getMonth(), 1);
  const at = (d, m) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, m);

      else res = await fetch(S.url + (S.url.includes('?') ? '&' : '?') + new URLSearchParams(Object.assign({ action, key: S.key }, params)).toString(), { signal: ac.signal });
    } catch (e) { throw new Error(e.name === 'AbortError' ? '서버 응답이 너무 늦어요. 잠시 뒤 다시 해 주세요' : '인터넷 연결을 확인해 주세요'); }

}

function layoutDay(items) {

function move(n) { const c = st.cur; st.cur = st.view === 'month' ? new Date(c.getFullYear(), c.getMonth() + n, 1) : addD(c, n * 7); render(n > 0 ? 'l' : 'r'); }
$('#prevBtn').onclick = () => move(-1); $('#nextBtn').onclick = () => move(1);
$('#titleBtn').onclick = () => { if (st.tab !== 'cal') return; st.cur = sod(new Date()); render(); };
$('#vMonth').onclick = () => { if (st.view === 'month') return; transit('down', () => { st.view = 'month'; S.view = 'month'; save(); render(); }); };
$('#vWeek').onclick = () => { if (st.view === 'week') return; transit('up', () => { const t = new Date(); st.cur = (t.getMonth() === st.cur.getMonth() && t.getFullYear() === st.cur.getFullYear()) ? sod(t) : new Date(st.cur.getFullYear(), st.cur.getMonth(), 1); st.view = 'week'; S.view = 'week'; save(); render(); }); };
let transiting = 0;
function transit(kind, fn) {
  const main = $('#main'), app = $('#app');
  if (Date.now() - transiting < 450) { fn(); return; } transiting = Date.now();
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { fn(); return; }
  app.querySelectorAll('.pg').forEach(x => x.remove()); main.classList.remove('pgin-back', 'pgin-up'); main.style.background = '';
  const old = main.cloneNode(true); old.removeAttribute('id'); old.querySelectorAll('[id]').forEach(x => x.removeAttribute('id'));
  Object.assign(old.style, { position: 'absolute', left: '0', right: '0', top: main.offsetTop + 'px', height: main.offsetHeight + 'px', pointerEvents: 'none', background: 'var(--pagebg)', overflow: 'hidden' });
  const sy = (main.querySelector('.scroller') || {}).scrollTop || 0;
  fn();
  const os = old.querySelector('.scroller'); if (os) os.scrollTop = sy;
  if (kind === 'fwd' || kind === 'down') {
    old.className = 'pg ' + kind; old.style.zIndex = 4; app.appendChild(old);
    old.addEventListener('animationend', () => old.remove(), { once: true });
  } else {
    old.className = 'pg under'; old.style.zIndex = 1; app.insertBefore(old, main);
    main.style.zIndex = 2; main.style.background = 'var(--pagebg)'; main.classList.add(kind === 'back' ? 'pgin-back' : 'pgin-up');
    main.addEventListener('animationend', () => { main.classList.remove('pgin-back', 'pgin-up'); main.style.background = ''; main.style.zIndex = ''; old.remove(); }, { once: true });
  }
  setTimeout(() => old.remove(), 1000);
}
const TABS = ['cal', 'task', 'gantt'];
const setTab = t => { if (t === st.tab) return; const kind = TABS.indexOf(t) > TABS.indexOf(st.tab) ? 'fwd' : 'back'; transit(kind, () => { st.tab = t; S.tab = t; save(); render(); }); };
$('#nCal').onclick = () => setTab('cal'); $('#nTask').onclick = () => setTab('task'); $('#nGantt').onclick = () => setTab('gantt');
$('#nAdd').onclick = () => { if (st.tab === 'task') { const d = $('#tDraft'); if (d) { d.focus(); d.scrollIntoView({ block: 'center' }); } } else if (st.tab === 'gantt') openPlan(); else openCreate(); };
$('#nSet').onclick = () => openSettings();
let tx = null, ty = null;
$('#main').addEventListener('touchstart', e => { if (st.tab !== 'cal') return; if (e.touches.length === 1) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } }, { passive: true });
$('#main').addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) move(dx < 0 ? 1 : -1); }, { passive: true });
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => render(), 200); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !sheetStack.length) { checkUpdate(); Object.keys(M.ts).forEach(k => M.ts[k] = 0); T.ts = 0; G.ts = 0; render(); } });

/* 새 화면 버전이 올라오면 저절로 새로 고침 */
async function checkUpdate() {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return; const j = await r.json();
    if (j.v && j.v !== APP_V && !sheetStack.length) location.replace(location.pathname + '?v=' + encodeURIComponent(j.v));
  } catch (e) {}
}
function openCover() {
  const c = document.getElementById('cover'); if (!c || c.dataset.go) return;
  c.dataset.go = '1';
  const wait = Math.max(0, 1000 - performance.now());
  setTimeout(() => requestAnimationFrame(() => {
    c.classList.add('open');
    setTimeout(() => c.remove(), 1150);
  }), wait);
}
async function boot() {
  checkUpdate();
  loadLocal();
  try { render(); } finally { openCover(); }
  if (!demo()) api('ping').then(r => { const v = r.v || 1; if (v !== S.sv) { S.sv = v; save(); setHeader(); } }).catch(() => {});
  try { const r = await api('calendars'); const changed = JSON.stringify(r.calendars) !== JSON.stringify(st.cals); setCals(r.calendars); if (changed) render(); }
  catch (err) { toast('연결 실패: ' + err.message + ' · 설정을 확인해 주세요'); }
}
boot();
setTimeout(openCover, 4000);
</script>
